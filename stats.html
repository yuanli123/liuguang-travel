<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流光幻旅 · 统计看板</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --hairline: #2c2c2a;
    --brand-1: #8b5cf6; /* App 品牌紫（仅页面镶边，不用于数据编码） */
    --brand-2: #2ec4b6; /* App 品牌青（同上） */
    /* 数据系列色（dataviz 验证通过 · dark surface #1a1a19） */
    --s-new: #3987e5;   /* 新增用户 */
    --s-play: #d95926;  /* 播放 */
    --s-fav: #199e70;   /* 收藏 */
    --s-rep: #c98500;   /* 纠错 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .topbar {
    padding: 18px 24px;
    background: linear-gradient(120deg, #8b5cf6 0%, #2ec4b6 100%);
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 700; font-size: 17px; letter-spacing: .5px;
  }
  .topbar button {
    background: rgba(0,0,0,.25); color: #fff; border: 1px solid rgba(255,255,255,.35);
    border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 24px 48px; }
  .panel {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 12px; padding: 20px; margin-top: 16px;
  }
  .panel h2 { font-size: 15px; color: var(--ink-2); margin-bottom: 14px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--ink-3); margin-left: 8px; font-weight: 400; }

  /* 令牌门 */
  #tokenGate {
    max-width: 420px; margin: 80px auto; background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 12px; padding: 28px;
  }
  #tokenGate h1 { font-size: 16px; margin-bottom: 6px; }
  #tokenGate p { font-size: 13px; color: var(--ink-3); margin-bottom: 16px; line-height: 1.6; }
  #tokenGate input {
    width: 100%; background: var(--bg); border: 1px solid var(--hairline);
    border-radius: 8px; color: var(--ink); padding: 10px 12px; font-size: 13px; margin-bottom: 12px;
  }
  #tokenGate button {
    width: 100%; background: linear-gradient(120deg, #8b5cf6, #2ec4b6); color: #fff;
    border: none; border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #tokenErr { color: #e66767; font-size: 12px; min-height: 16px; margin-top: 8px; }

  /* 总览卡片 */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px;
    padding: 16px; border-top: 3px solid var(--brand-1);
  }
  .card .val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .lbl { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .card .sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

  /* 趋势图（分组柱状） */
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart { display: flex; align-items: flex-end; gap: 14px; padding: 8px 4px 0; overflow-x: auto; }
  .day { flex: 1; min-width: 56px; display: flex; flex-direction: column; align-items: center; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 150px; }
  .bars i {
    width: 9px; display: block; border-radius: 4px 4px 0 0;
    min-height: 2px; /* 0 值也有 2px 底点，可点击 */
    transition: filter .15s;
  }
  .bars i:hover { filter: brightness(1.25); }
  .day .dlabel { font-size: 11px; color: var(--ink-3); margin-top: 8px; white-space: nowrap; }
  .chart-tip {
    position: fixed; z-index: 50; pointer-events: none;
    background: #2c2c2a; color: var(--ink); font-size: 12px;
    padding: 6px 10px; border-radius: 8px; border: 1px solid #383835;
    display: none; white-space: nowrap;
  }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--hairline); }
  th { color: var(--ink-3); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  td.num, th.num { font-variant-numeric: tabular-nums; }
  tr:hover td { background: #22221f; }
  .bar-cell { min-width: 90px; }
  .bar-cell .track { background: var(--hairline); border-radius: 4px; height: 6px; overflow: hidden; }
  .bar-cell .fill { background: #3987e5; height: 100%; border-radius: 4px; }
  .empty { color: var(--ink-3); font-size: 13px; padding: 24px 0; text-align: center; }

  /* 纠错区 */
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button {
    background: transparent; color: var(--ink-2); border: 1px solid var(--hairline);
    border-radius: 999px; padding: 5px 14px; font-size: 12px; cursor: pointer;
  }
  .tabs button.on { background: rgba(139,92,246,.18); border-color: #8b5cf6; color: #fff; }
  .report { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hairline); align-items: flex-start; }
  .report .meta { flex: 1; min-width: 0; }
  .report .story { font-size: 13px; color: var(--ink-2); }
  .report .story b { color: var(--ink); font-weight: 600; }
  .report .content { font-size: 13px; margin-top: 4px; line-height: 1.6; }
  .report .time { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
  .report .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .report .actions button {
    border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--hairline); background: transparent; color: var(--ink-2);
  }
  .report .actions .ok { border-color: #199e70; color: #199e70; }
  .report .actions .no { border-color: #d95926; color: #d95926; }
  .badge { font-size: 11px; border-radius: 999px; padding: 2px 8px; }
  .badge.p0 { background: rgba(201,133,0,.18); color: #c98500; }
  .badge.p1 { background: rgba(25,158,112,.18); color: #199e70; }
  .badge.p2 { background: rgba(217,89,38,.18); color: #d95926; }

  /* AI 故事工坊 */
  .ai-form input, .ai-form select, .ai-form textarea {
    background: var(--bg); border: 1px solid var(--hairline); color: var(--ink);
    border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: inherit;
  }
  .ai-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .ai-row input { flex: 1; min-width: 140px; }
  .ai-form textarea { width: 100%; min-height: 70px; margin-bottom: 10px; resize: vertical; }
  .script-ta { min-height: 180px; }
  button.primary {
    background: linear-gradient(120deg, #8b5cf6, #2ec4b6); border: none; color: #fff;
    border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  #aiGenErr { color: #e66767; font-size: 12px; min-height: 16px; margin-bottom: 8px; }
  .ai-actions { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .ai-actions button {
    background: transparent; color: var(--ink-2); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  .ai-actions .ok-btn { background: rgba(139,92,246,.18); border-color: #8b5cf6; color: #fff; }
  #aiSaveMsg { font-size: 12px; color: var(--ink-2); }
  .ai-tts-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  #aiTtsMsg { font-size: 12px; color: var(--ink-2); }
  #aiTtsMsg a { color: #3987e5; }
  .sub-h { font-size: 13px; color: var(--ink-2); margin: 18px 0 10px; font-weight: 600; }
  .ai-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  .ai-item .t { flex: 1; min-width: 0; }
  .ai-item .t b { font-weight: 600; }
  .ai-item .t .meta { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .ai-item button {
    background: transparent; border: 1px solid var(--hairline); color: var(--ink-2);
    border-radius: 8px; padding: 4px 12px; font-size: 12px; cursor: pointer; flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="topbar">
  <span>流光幻旅 · 统计看板</span>
  <button id="btnLogout" hidden>退出</button>
</div>

<div id="tokenGate">
  <h1>🔐 管理员令牌</h1>
  <p>输入服务器 .env 里的 ADMIN_TOKEN 进入看板。令牌只保存在本机浏览器 localStorage 中。</p>
  <input id="tokenInput" type="password" placeholder="粘贴 ADMIN_TOKEN">
  <button id="btnEnter">进入看板</button>
  <div id="tokenErr"></div>
</div>

<main id="dash" hidden>
  <div class="cards" id="overviewCards"></div>

  <div class="panel">
    <h2>近 7 日趋势<span class="hint">新增用户 · 播放 · 收藏 · 纠错（按事件时间聚合）</span></h2>
    <div class="legend" id="trendLegend"></div>
    <div class="chart" id="trendChart"></div>
  </div>

  <div class="panel">
    <h2>故事热度榜<span class="hint">按累计播放排序 · 完播率 = 完播用户 / 播过用户</span></h2>
    <table>
      <thead><tr>
        <th>故事</th><th>城市</th><th class="num">播放</th><th class="num">收藏</th>
        <th class="num">完播率</th><th class="num">收听时长</th><th class="num">加入行程</th><th class="num">纠错</th>
      </tr></thead>
      <tbody id="storyBody"></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>AI 故事工坊<span class="hint">DeepSeek 生成故事脚本 + edge-tts 合成配音</span></h2>
    <div class="ai-form">
      <div class="ai-row">
        <input id="aiTopic" placeholder="主题/景点（必填），如：黄山迎客松">
        <select id="aiCity">
          <option value="">城市（可选）</option>
          <option>北京</option><option>上海</option><option>杭州</option><option>苏州</option>
          <option>成都</option><option>西安</option><option>南京</option><option>厦门</option>
        </select>
        <select id="aiStyle">
          <option>治愈</option><option>悬疑</option><option>史诗</option><option>纪实</option>
        </select>
        <button id="aiGenBtn" class="primary">✨ 生成故事</button>
      </div>
      <textarea id="aiMaterial" placeholder="补充素材（选填）：史实、传说、你的想法…"></textarea>
      <div id="aiGenErr"></div>
    </div>
    <div id="aiResult" hidden>
      <div class="ai-row">
        <input id="aiTitle" placeholder="标题">
        <input id="aiHook" placeholder="钩子文案（40 字内）">
      </div>
      <div class="ai-row">
        <input id="aiTags" placeholder="情绪标签，逗号分隔，如：震撼,温暖">
        <select id="aiCat">
          <option>历史</option><option>传说</option><option>地质</option><option>人文</option>
        </select>
        <select id="aiCity2">
          <option value="其他">其他城市</option>
          <option>北京</option><option>上海</option><option>杭州</option><option>苏州</option>
          <option>成都</option><option>西安</option><option>南京</option><option>厦门</option>
        </select>
        <input id="aiSlug" placeholder="slug（英文标识）">
      </div>
      <textarea id="aiScript" class="script-ta" placeholder="故事正文"></textarea>
      <div class="ai-actions">
        <button id="aiSaveDraft">存草稿</button>
        <button id="aiPublish" class="ok-btn">🚀 直接上架</button>
        <span id="aiSaveMsg"></span>
      </div>
      <div class="ai-tts-row" id="aiTtsRow" hidden>
        <select id="aiVoice" title="配音音色（留空=按情绪标签自动匹配）">
          <option value="">🎙 自动匹配</option>
          <option value="zh-CN-XiaoxiaoNeural">晓晓 · 女声温柔</option>
          <option value="zh-CN-XiaoyiNeural">晓伊 · 女声活泼</option>
          <option value="zh-CN-YunxiNeural">云希 · 男声磁性</option>
          <option value="zh-CN-YunjianNeural">云健 · 男声浑厚</option>
          <option value="zh-CN-YunyangNeural">云扬 · 男声播报</option>
          <option value="zh-CN-YunxiaNeural">云夏 · 男声少年</option>
        </select>
        <button id="aiVoicePreview" title="试听所选音色">▶ 试听</button>
        <button id="aiTtsBtn" class="primary">🔊 合成配音</button>
        <span id="aiTtsMsg"></span>
      </div>
    </div>
    <h3 class="sub-h">最近生成</h3>
    <div id="aiList"></div>
  </div>

  <div class="panel">
    <h2>内容纠错<span class="hint">用户提交的纠错，可直接采纳或驳回</span></h2>
    <div class="tabs" id="reportTabs">
      <button data-s="" class="on">全部</button>
      <button data-s="0">待处理</button>
      <button data-s="1">已采纳</button>
      <button data-s="2">已驳回</button>
    </div>
    <div id="reportList"></div>
  </div>
</main>

<div class="chart-tip" id="chartTip"></div>

<script>
(() => {
  "use strict";
  const API = "http://localhost:3000";
  const TOKEN_KEY = "liuguang_admin_token";
  const $ = (id) => document.getElementById(id);

  let token = localStorage.getItem(TOKEN_KEY) || "";

  async function api(path) {
    const res = await fetch(API + path, {
      headers: token ? { Authorization: "Bearer " + token } : {},
    });
    if (res.status === 401) {
      token = "";
      localStorage.removeItem(TOKEN_KEY);
      showGate("令牌无效或已过期，请重新输入");
      throw new Error("unauthorized");
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || "请求失败");
    }
    return res.json();
  }
  async function apiPost(path, body) {
    const res = await fetch(API + path, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: "Bearer " + token } : {}),
      },
      body: JSON.stringify(body || {}),
    });
    if (res.status === 401) {
      token = "";
      localStorage.removeItem(TOKEN_KEY);
      showGate("令牌无效或已过期，请重新输入");
      throw new Error("unauthorized");
    }
    if (!res.ok) {
      const b = await res.json().catch(() => ({}));
      throw new Error(b.error || "请求失败");
    }
    return res.json();
  }

  /* ---------- 令牌门 ---------- */
  function showGate(err) {
    $("dash").hidden = true;
    $("btnLogout").hidden = true;
    $("tokenGate").hidden = false;
    $("tokenErr").textContent = err || "";
  }
  function showDash() {
    $("tokenGate").hidden = true;
    $("dash").hidden = false;
    $("btnLogout").hidden = false;
    loadAll();
  }
  function enter() {
    const v = $("tokenInput").value.trim();
    if (!v) { $("tokenErr").textContent = "请输入令牌"; return; }
    token = v;
    localStorage.setItem(TOKEN_KEY, v);
    $("tokenInput").value = "";
    loadAll();
  }
  $("btnEnter").addEventListener("click", enter);
  $("tokenInput").addEventListener("keydown", (e) => { if (e.key === "Enter") enter(); });
  $("btnLogout").addEventListener("click", () => { token = ""; localStorage.removeItem(TOKEN_KEY); showGate(); });

  /* ---------- 格式化 ---------- */
  function fmtPlays(n) {
    n = Number(n) || 0;
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "万";
    return String(n);
  }
  function fmtSec(s) {
    s = Number(s) || 0;
    if (s < 60) return s + "秒";
    if (s < 3600) return (s / 60).toFixed(0) + "分钟";
    return (s / 3600).toFixed(1) + "小时";
  }
  function fmtTime(t) {
    if (!t) return "";
    return String(t).slice(0, 16).replace("T", " ");
  }

  /* ---------- 加载 ---------- */
  async function loadAll() {
    await Promise.all([
      api("/api/admin/stats/overview").then(renderOverview).catch((e) => fail("overview", e)),
      api("/api/admin/stats/trend?days=7").then(renderTrend).catch((e) => fail("trend", e)),
      api("/api/admin/stats/stories?limit=20").then(renderStories).catch((e) => fail("stories", e)),
      loadReports("").catch((e) => fail("reports", e)),
      loadAiList().catch((e) => fail("aiList", e)),
    ]);
    if (!token) return; // 401 时 api() 已清令牌并回到令牌门，不再展示看板
    $("tokenGate").hidden = true;
    $("dash").hidden = false;
    $("btnLogout").hidden = false;
  }
  function fail(section, e) {
    console.error("[" + section + "]", e);
  }

  /* ---------- 总览 ---------- */
  function renderOverview(o) {
    const cards = [
      ["注册用户", String(o.users), ""],
      ["上架故事", `${o.published} / ${o.stories}`, `${o.cities} 个城市`],
      ["累计播放", fmtPlays(o.plays), `播放事件 ${o.playEvents}`],
      ["完播率", o.completeRate + "%", `完播 ${o.completes} 次`],
      ["收藏", String(o.favorites), ""],
      ["加入行程", String(o.tripItems), `${o.trips} 个行程`],
      ["待处理纠错", String(o.reports.pending), `已采纳 ${o.reports.accepted} · 已驳回 ${o.reports.rejected}`],
    ];
    $("overviewCards").innerHTML = cards
      .map(([l, v, s]) => `<div class="card"><div class="val">${v}</div><div class="lbl">${l}</div><div class="sub">${s}</div></div>`)
      .join("");
  }

  /* ---------- 趋势（分组柱状，色板经 dataviz 校验） ---------- */
  const SERIES = [
    { key: "newUsers", label: "新增用户", color: "#3987e5" },
    { key: "playEvents", label: "播放", color: "#d95926" },
    { key: "favorites", label: "收藏", color: "#199e70" },
    { key: "reports", label: "纠错", color: "#c98500" },
  ];
  function renderTrend(d) {
    $("trendLegend").innerHTML = SERIES
      .map((s) => `<span><i style="background:${s.color}"></i>${s.label}</span>`)
      .join("");
    const max = Math.max(1, ...d.days.flatMap((day) => SERIES.map((s) => day[s.key])));
    $("trendChart").innerHTML = d.days
      .map((day) => {
        const bars = SERIES
          .map((s) => {
            const v = day[s.key];
            const h = Math.max(2, Math.round((v / max) * 148));
            return `<i data-v="${v}" data-label="${s.label}" data-date="${day.date}"
                style="height:${h}px;background:${s.color}"></i>`;
          })
          .join("");
        const label = day.date.slice(5);
        return `<div class="day"><div class="bars">${bars}</div><div class="dlabel">${label}</div></div>`;
      })
      .join("");
    // 悬浮提示
    const tip = $("chartTip");
    $("trendChart").querySelectorAll(".bars i").forEach((el) => {
      el.addEventListener("mouseenter", () => {
        tip.textContent = `${el.dataset.date} · ${el.dataset.label} ${el.dataset.v}`;
        tip.style.display = "block";
      });
      el.addEventListener("mousemove", (e) => {
        tip.style.left = e.clientX + 12 + "px";
        tip.style.top = e.clientY + 12 + "px";
      });
      el.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    });
  }

  /* ---------- 故事热度榜 ---------- */
  function renderStories(data) {
    const rows = data.stories;
    if (!rows.length) {
      $("storyBody").innerHTML = `<tr><td colspan="8" class="empty">暂无数据</td></tr>`;
      return;
    }
    const maxPlays = Math.max(1, rows[0].playCount);
    $("storyBody").innerHTML = rows
      .map((s) => {
        const pct = Math.round((s.playCount / maxPlays) * 100);
        return `<tr>
          <td><div class="story-title">${escapeHtml(s.title)}</div>
              <div class="bar-cell"><div class="track"><div class="fill" style="width:${pct}%"></div></div></div></td>
          <td>${escapeHtml(s.city)}</td>
          <td class="num">${fmtPlays(s.playCount)}</td>
          <td class="num">${s.favCount}</td>
          <td class="num">${s.completeRate}%</td>
          <td class="num">${fmtSec(s.listenSec)}</td>
          <td class="num">${s.tripCount}</td>
          <td class="num">${s.reportCount}</td>
        </tr>`;
      })
      .join("");
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* ---------- 纠错处理 ---------- */
  let reportFilter = "";
  async function loadReports(status) {
    const q = status === "" ? "" : "?status=" + status;
    const data = await api("/api/admin/reports" + q);
    renderReports(data.reports);
  }
  function renderReports(reports) {
    if (!reports.length) {
      $("reportList").innerHTML = `<div class="empty">暂无纠错记录</div>`;
      return;
    }
    $("reportList").innerHTML = reports
      .map((r) => {
        const badge = r.status === 0 ? `<span class="badge p0">待处理</span>`
          : r.status === 1 ? `<span class="badge p1">已采纳</span>`
          : `<span class="badge p2">已驳回</span>`;
        const actions = r.status === 0
          ? `<div class="actions">
               <button class="ok" data-id="${r.id}" data-s="1">采纳</button>
               <button class="no" data-id="${r.id}" data-s="2">驳回</button>
             </div>`
          : "";
        return `<div class="report">
          <div class="meta">
            <div class="story"><b>${escapeHtml(r.title)}</b> ${badge}</div>
            <div class="content">${escapeHtml(r.content)}</div>
            <div class="time">${r.reporterNickname ? escapeHtml(r.reporterNickname) : "游客"} · ${fmtTime(r.createdAt)}</div>
          </div>
          ${actions}
        </div>`;
      })
      .join("");
    $("reportList").querySelectorAll(".actions button").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await fetch(`${API}/api/admin/reports/${btn.dataset.id}/resolve`, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
            body: JSON.stringify({ status: Number(btn.dataset.s) }),
          });
          loadReports(reportFilter);
        } catch (e) {
          console.error(e);
          btn.disabled = false;
        }
      });
    });
  }
  $("reportTabs").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    document.querySelectorAll("#reportTabs button").forEach((b) => b.classList.remove("on"));
    btn.classList.add("on");
    reportFilter = btn.dataset.s;
    loadReports(reportFilter);
  });

  /* ---------- AI 故事工坊 ---------- */
  let aiStory = null; // 当前生成/已保存的故事

  function fillAiEditor(s) {
    $("aiTitle").value = s.title || "";
    $("aiHook").value = s.hook || "";
    $("aiTags").value = (s.emotionTags || []).join(",");
    $("aiCat").value = s.category || "人文";
    $("aiCity2").value = s.city || "其他";
    $("aiSlug").value = s.slug || "";
    $("aiScript").value = s.script || "";
    $("aiResult").hidden = false;
  }

  function readAiEditor() {
    return {
      slug: $("aiSlug").value.trim(),
      title: $("aiTitle").value.trim(),
      hook: $("aiHook").value.trim(),
      emotionTags: $("aiTags").value.split(/[,，]/).map((t) => t.trim()).filter(Boolean),
      category: $("aiCat").value,
      city: $("aiCity2").value,
      script: $("aiScript").value.trim(),
      sourceNote: aiStory && aiStory.sourceNote ? aiStory.sourceNote : "",
    };
  }

  $("aiGenBtn").addEventListener("click", async () => {
    const topic = $("aiTopic").value.trim();
    if (!topic) {
      $("aiGenErr").textContent = "请先填写主题/景点";
      return;
    }
    $("aiGenErr").textContent = "";
    $("aiGenBtn").disabled = true;
    $("aiGenBtn").textContent = "生成中…";
    try {
      const d = await apiPost("/api/admin/ai/generate", {
        topic,
        city: $("aiCity").value,
        style: $("aiStyle").value,
        material: $("aiMaterial").value.trim(),
      });
      aiStory = d.story;
      fillAiEditor(aiStory);
      $("aiTtsRow").hidden = true;
      $("aiSaveMsg").textContent = "已生成，可修改后保存";
    } catch (e) {
      $("aiGenErr").textContent = e.message;
    } finally {
      $("aiGenBtn").disabled = false;
      $("aiGenBtn").textContent = "✨ 生成故事";
    }
  });

  async function saveAiStory(publish) {
    const story = readAiEditor();
    if (!story.title || story.script.length < 100) {
      $("aiSaveMsg").textContent = "标题与正文（至少 100 字）不能为空";
      return;
    }
    try {
      const r = await apiPost("/api/admin/ai/stories", { story, publish });
      aiStory = { ...story, id: r.storyId, slug: r.slug };
      $("aiSlug").value = r.slug;
      $("aiSaveMsg").textContent = publish
        ? `✅ 已上架（slug: ${r.slug}），App 立即可听`
        : `已存草稿（slug: ${r.slug}）`;
      $("aiTtsRow").hidden = false;
      $("aiTtsMsg").textContent = "";
      loadAiList().catch(() => {});
    } catch (e) {
      $("aiSaveMsg").textContent = e.message;
    }
  }
  $("aiSaveDraft").addEventListener("click", () => saveAiStory(false));
  $("aiPublish").addEventListener("click", () => saveAiStory(true));

  $("aiTtsBtn").addEventListener("click", async () => {
    if (!aiStory || !aiStory.id) {
      $("aiTtsMsg").textContent = "请先保存故事";
      return;
    }
    $("aiTtsBtn").disabled = true;
    $("aiTtsMsg").textContent = "合成中，约 10-30 秒…";
    try {
      const r = await apiPost("/api/admin/ai/tts", { storyId: aiStory.id, voice: $("aiVoice").value });
      $("aiTtsMsg").innerHTML = `✅ 配音完成，<a href="${r.audioUrl}" target="_blank">试听</a>（App 将自动使用此音频）`;
      loadAiList().catch(() => {});
    } catch (e) {
      $("aiTtsMsg").textContent = e.message;
    } finally {
      $("aiTtsBtn").disabled = false;
    }
  });

  // 音色试听：下拉默认值按故事标签自动匹配提示
  $("aiVoicePreview").addEventListener("click", async () => {
    const voice = $("aiVoice").value;
    if (!voice) {
      $("aiTtsMsg").textContent = "「自动匹配」按故事的情绪标签选音色，先选具体音色再试听";
      return;
    }
    $("aiVoicePreview").disabled = true;
    $("aiVoicePreview").textContent = "合成中…";
    try {
      const r = await apiPost("/api/admin/ai/tts-sample", { voice });
      const audio = new Audio(API + r.sampleUrl); // sampleUrl 是相对路径，需补 API 源
      await audio.play();
      $("aiVoicePreview").textContent = "▶ 试听";
    } catch (e) {
      $("aiTtsMsg").textContent = e.message;
      $("aiVoicePreview").textContent = "▶ 试听";
    } finally {
      $("aiVoicePreview").disabled = false;
    }
  });

  async function loadAiList() {
    const d = await api("/api/admin/ai/list");
    const list = d.stories || [];
    if (!list.length) {
      $("aiList").innerHTML = `<div class="empty">还没有 AI 生成的故事</div>`;
      return;
    }
    $("aiList").innerHTML = list
      .map((s) => {
        const statusBadge = s.status === 2 ? `<span class="badge p1">已上架</span>` : `<span class="badge p0">草稿</span>`;
        const audioBadge = s.audioUrl ? `<span class="badge p1">配音✅</span>` : "";
        const coverBadge = s.coverUrl ? `<span class="badge p1">封面✅</span>` : "";
        return `<div class="ai-item">
          <div class="t">
            <b>${escapeHtml(s.title)}</b> · ${escapeHtml(s.city)} · ${escapeHtml(s.slug)}
            <div class="meta">${statusBadge} ${audioBadge} ${coverBadge} ${fmtTime(s.createdAt)}</div>
          </div>
          ${s.audioUrl ? "" : `<button data-id="${s.id}" class="ai-tts-quick">🔊 配音</button>`}
          ${s.coverUrl ? "" : `<button data-id="${s.id}" class="ai-cover-quick">🎨 封面</button>`}
        </div>`;
      })
      .join("");
    $("aiList").querySelectorAll(".ai-tts-quick").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "合成中…";
        try {
          await apiPost("/api/admin/ai/tts", { storyId: Number(btn.dataset.id) });
          loadAiList().catch(() => {});
        } catch (e) {
          btn.textContent = "失败";
          btn.disabled = false;
        }
      });
    });
    $("aiList").querySelectorAll(".ai-cover-quick").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "生成中…";
        try {
          await apiPost("/api/admin/ai/cover", { storyId: Number(btn.dataset.id) });
          loadAiList().catch(() => {});
        } catch (e) {
          btn.textContent = "失败";
          btn.disabled = false;
        }
      });
    });
  }

  /* ---------- 启动 ---------- */
  if (token) {
    loadAll(); // 401 会自动回到令牌门
  } else {
    showGate();
  }
})();
</script>
</body>
</html>
