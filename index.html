<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <title>流光幻旅</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="phone-frame">
    <!-- 地图 -->
    <section id="view-map" class="view view-map active">
      <div class="map-search-wrap">
        <div class="map-search">
          <span class="map-search-icon" aria-hidden="true">🔍</span>
          <input type="search" id="mapSearchInput" placeholder="搜索地点或故事..." autocomplete="off" />
        </div>
      </div>
      <div class="map-stage" id="mapStage">
        <div class="map-grid"></div>
        <div class="map-pins" id="mapPins"></div>
        <p class="map-hint">点击地图上的故事点，或等待附近推荐</p>
      </div>
      <div id="mapStoryCard" class="map-story-card hidden">
        <button type="button" class="map-card-close" id="mapCardClose" aria-label="关闭">×</button>
        <div class="map-card-cover" id="mapCardCover"></div>
        <div class="map-card-body">
          <div class="map-card-row">
            <div>
              <h2 class="map-card-title" id="mapCardTitle"></h2>
              <p class="map-card-loc" id="mapCardLoc"></p>
            </div>
            <span class="mood-pill" id="mapCardMood"></span>
          </div>
          <p class="map-card-hook" id="mapCardHook"></p>
          <div class="map-card-actions">
            <button type="button" class="btn-play-big" id="mapCardPlay">
              <span class="play-tri">▶</span>
              <span id="mapCardPlayLabel">播放</span>
            </button>
            <button type="button" class="btn-bookmark" id="mapCardSave" aria-label="收藏">🔖</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 故事 Feed -->
    <section id="view-feed" class="view view-feed">
      <header class="feed-header">
        <h1 class="feed-title">发现故事</h1>
        <button type="button" class="btn-icon-round" id="feedSearchToggle" aria-label="搜索">🔍</button>
      </header>
      <div id="feedSearchBar" class="feed-search-bar hidden">
        <input type="search" id="feedSearchInput" placeholder="搜地点、标题或关键词..." />
      </div>
      <div class="city-tags-wrap">
        <span class="city-pin" aria-hidden="true">📍</span>
        <div class="city-tags" id="cityTags"></div>
      </div>
      <div class="feed-toolbar">
        <button type="button" class="btn-random" id="btnRandomListen">🎲 随机听一段</button>
      </div>
      <div class="feed-scroll" id="feedList"></div>
    </section>

    <!-- 我的 -->
    <section id="view-me" class="view view-me">
      <div class="me-hero">
        <div class="me-avatar-wrap">
          <div class="me-avatar">👤</div>
        </div>
        <div class="me-hero-text">
          <p class="me-name">流光旅人</p>
          <p class="me-tagline">探索 · 发现 · 记录</p>
        </div>
        <div class="me-stats" id="meStats"></div>
      </div>
      <div class="me-panel">
        <nav class="me-tabs" id="meTabs">
          <button type="button" class="me-tab active" data-me-tab="trip">行程规划</button>
          <button type="button" class="me-tab" data-me-tab="history">听过的</button>
          <button type="button" class="me-tab" data-me-tab="fav">收藏</button>
        </nav>
        <div id="meContentTrip" class="me-tab-panel active">
          <div class="ai-route-card">
            <div class="ai-route-head">
              <span class="ai-spark">✨</span>
              <div>
                <p class="ai-route-title">AI 故事漫步路线</p>
                <p class="ai-route-meta" id="aiRouteMeta">添加行程点后自动生成</p>
              </div>
            </div>
            <div class="route-map-visual" id="routeMapVisual"></div>
          </div>
          <ul class="trip-story-list" id="tripStoryList"></ul>
        </div>
        <div id="meContentHistory" class="me-tab-panel">
          <ul class="simple-list" id="historyList"></ul>
        </div>
        <div id="meContentFav" class="me-tab-panel">
          <ul class="simple-list" id="favList"></ul>
        </div>
      </div>
    </section>

    <!-- 底部导航 -->
    <nav class="bottom-nav" id="bottomNav">
      <button type="button" class="nav-item active" data-nav="map">
        <span class="nav-icon">🗺</span>
        <span>地图</span>
      </button>
      <button type="button" class="nav-item" data-nav="feed">
        <span class="nav-icon">📖</span>
        <span>故事</span>
      </button>
      <button type="button" class="nav-item" data-nav="me">
        <span class="nav-icon">👤</span>
        <span>我的</span>
      </button>
    </nav>

    <!-- 播放全屏 -->
    <div id="playerOverlay" class="player-overlay hidden" aria-hidden="true">
      <div class="player-bg" id="playerBg"></div>
      <div class="player-scrim"></div>
      <header class="player-top">
        <button type="button" class="btn-back" id="playerClose">‹</button>
        <span class="player-mood" id="playerMood"></span>
      </header>
      <div class="player-body">
        <h2 class="player-title" id="playerTitle"></h2>
        <p class="player-loc" id="playerLoc"></p>
        <p class="player-hook" id="playerHook"></p>
        <audio id="audioEl" preload="metadata"></audio>
        <div class="player-controls">
          <span class="time-left" id="timeRemaining">剩余 --:--</span>
          <input type="range" id="seekBar" class="seek-bar" min="0" max="100" value="0" />
          <div class="speed-row" id="speedRow"></div>
        </div>
        <div class="player-actions">
          <button type="button" class="btn-secondary" id="btnAddTrip">加入行程</button>
          <button type="button" class="btn-secondary" id="btnToggleFav">收藏</button>
        </div>
        <div class="next-story" id="nextStoryBlock">
          <p class="next-label">下一个推荐</p>
          <button type="button" class="next-card" id="nextStoryBtn"></button>
        </div>
        <footer class="player-footer-meta">
          <p class="source-note" id="sourceNote"></p>
          <button type="button" class="link-btn" id="btnReport">内容纠错</button>
        </footer>
      </div>
    </div>

    <!-- 登录 -->
    <div id="loginOverlay" class="login-screen">
      <div class="login-bg" aria-hidden="true">
        <div class="login-bokeh"></div>
      </div>
      <div class="login-content">
        <div class="login-brand">
          <div class="login-logo-box" aria-hidden="true">
            <svg class="login-logo-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 8l2.8 8.6h9.1l-7.4 5.4 2.8 8.6L24 25.2l-7.3 5.4 2.8-8.6-7.4-5.4h9.1L24 8z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="36" cy="14" r="2" fill="white" opacity="0.9"/>
              <circle cx="12" cy="20" r="1.5" fill="white" opacity="0.7"/>
            </svg>
          </div>
          <h1 class="login-app-name">流光幻旅</h1>
          <p class="login-slogan">把「看见」升级为「读懂」</p>
        </div>

        <div class="login-glass-card">
          <div class="login-phone-row">
            <span class="login-phone-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
              </svg>
            </span>
            <input type="tel" id="loginPhoneInput" placeholder="输入手机号" maxlength="11" inputmode="numeric" autocomplete="tel" />
          </div>
          <div id="loginCodeRow" class="login-code-row hidden">
            <input type="text" id="loginCodeInput" placeholder="输入验证码" maxlength="6" inputmode="numeric" />
          </div>
          <button type="button" class="login-btn-primary" id="loginGetCode">获取验证码</button>
        </div>

        <button type="button" class="login-btn-wechat" id="loginWechat">
          <span class="wechat-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8.5 4C4.91 4 2 6.46 2 9.58c0 1.75.94 3.33 2.43 4.38-.1.95-.32 2.3-1.03 3.28a.5.5 0 01-.08.07c-.05.04-.1.08-.15.12-.07.1-.15.19-.24.27-.95.85-2.15 1.42-3.35 1.78C8.12 15.04 9.28 15.16 10.5 15.16c3.59 0 6.5-2.46 6.5-5.58S14.09 4 10.5 4H8.5zm-2 4.5a.75.75 0 110-1.5.75.75 0 010 1.5zm4 0a.75.75 0 110-1.5.75.75 0 010 1.5zM22 14.42c0-2.52-2.24-4.58-5-4.58-2.76 0-5 2.06-5 4.58 0 2.52 2.24 4.58 5 4.58.98 0 1.9-.22 2.72-.6.85.28 1.72.68 2.42 1.2.06.05.12.1.17.16-.48-.82-.68-1.72-.75-2.48 1.18-.88 1.94-2.18 1.94-3.66zm-6.5-.67a.67.67 0 110-1.34.67.67 0 010 1.34zm3 0a.67.67 0 110-1.34.67.67 0 010 1.34z"/>
            </svg>
          </span>
          微信登录
        </button>

        <p class="login-agreement">
          登录即表示同意<a href="#">用户协议</a>和<a href="#">隐私政策</a>
        </p>
        <button type="button" class="login-skip" id="loginSkip">暂不登录，随便看看</button>
      </div>
    </div>

    <!-- 行前预览 -->
    <div id="previewSheet" class="sheet hidden">
      <div class="sheet-handle"></div>
      <h3 id="previewCityTitle"></h3>
      <p class="preview-one-liner" id="previewOneLiner"></p>
      <div class="preview-stats" id="previewStats"></div>
      <p class="preview-section-title">精选故事</p>
      <ul class="preview-picks" id="previewPicks"></ul>
      <button type="button" class="btn-primary-block" id="previewStart">开始探索</button>
    </div>
    <div id="sheetScrim" class="sheet-scrim hidden"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
